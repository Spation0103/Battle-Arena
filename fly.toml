# Змініть `app` на унікальну назву. Регіон waw (Варшава) — найближчий до України.
app = "neon-arena-CHANGEME"
primary_region = "waw"

[build]

[env]
  PORT = "8080"
  BOT_FILL = "4"

# Стан гри живе в памʼяті процесу -> рівно ОДИН інстанс, який не засинає.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
